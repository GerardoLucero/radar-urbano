name: Models check

on:
  schedule:
    - cron: '23 8 * * *'
  workflow_dispatch:
  pull_request:
    paths: ['models.json', '.github/scripts/check-models.sh']

permissions:
  contents: read

jobs:
  check:
    name: Modelos disponibles
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Probar cada modelo de models.json
        id: probe
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NVIDIA_NIM_API_KEY: ${{ secrets.NVIDIA_NIM_API_KEY }}
        run: .github/scripts/check-models.sh
      - name: Avisar por ntfy
        if: failure() && github.event_name != 'pull_request'
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          [ -n "$NTFY_TOPIC" ] || { echo "::warning::NTFY_TOPIC no configurado"; exit 0; }
          curl -fsS --max-time 15 -H "Title: Radar Urbano: modelo de IA no disponible" -H "Priority: high" \
            -d "Un modelo de models.json fallo. Editar models.json. ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            "https://ntfy.sh/$NTFY_TOPIC"
