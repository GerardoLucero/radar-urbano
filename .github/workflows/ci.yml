name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  html:
    name: HTML y JS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: html-validate
        run: npx --yes html-validate@11.17.0 index.html privacidad.html terminos.html arco.html
      - name: Sintaxis de site-assets/app.js
        run: |
          cp site-assets/app.js app-check.mjs
          node --check app-check.mjs

  sitemap:
    name: Sitemap y robots
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 .github/scripts/validate-sitemap.py

  build:
    name: Armado de _site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: bash .github/scripts/build-site.sh
      - name: Nada que no deba publicarse
        run: |
          if find _site \( -name 'README*' -o -name 'MODERATION*' -o -name 'RUNBOOK*' -o -path '*/supabase*' -o -path '*/.github*' -o -path '*/docs*' \) | grep -q .; then
            echo "_site contiene archivos que no deben publicarse"; exit 1
          fi

  gitleaks:
    name: Secretos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deno:
    name: Funciones (deno check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: has
        run: |
          if ls supabase/functions/*/index.ts >/dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "No hay funciones; se omite."
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.has.outputs.found == 'true'
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - if: steps.has.outputs.found == 'true'
        run: |
          for f in supabase/functions/*/index.ts; do
            echo "deno check $f"
            deno check "$f"
          done
