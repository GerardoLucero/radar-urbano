name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  html:
    name: HTML y JS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: html-validate
        run: npx --yes html-validate@11.17.0 index.html privacidad.html terminos.html arco.html
      - name: Sintaxis del JS embebido en index.html
        run: |
          python3 - <<'PY'
          import re
          html = open('index.html', encoding='utf-8').read()
          blocks = re.findall(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>', html, re.S)
          if not blocks:
              raise SystemExit('No se encontro JS embebido en index.html')
          for i, code in enumerate(blocks):
              open(f'extracted-{i}.mjs', 'w', encoding='utf-8').write(code)
          print(f'{len(blocks)} bloque(s) extraidos')
          PY
          for f in extracted-*.mjs; do node --check "$f"; done

  sitemap:
    name: Sitemap y robots
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: python3 .github/scripts/validate-sitemap.py

  build:
    name: Armado de _site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: bash .github/scripts/build-site.sh
      - name: Nada que no deba publicarse
        run: |
          if find _site \( -name 'README*' -o -name 'MODERATION*' -o -name 'RUNBOOK*' -o -path '*/supabase*' -o -path '*/.github*' -o -path '*/docs*' \) | grep -q .; then
            echo "_site contiene archivos que no deben publicarse"; exit 1
          fi

  gitleaks:
    name: Secretos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deno:
    name: Funciones (deno check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: has
        run: |
          if ls supabase/functions/*/index.ts >/dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "No hay funciones; se omite."
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.has.outputs.found == 'true'
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - if: steps.has.outputs.found == 'true'
        run: |
          for f in supabase/functions/*/index.ts; do
            echo "deno check $f"
            deno check "$f"
          done
