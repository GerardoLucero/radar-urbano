name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'supabase/**'
      - '.github/dependabot.yml'
      - '.github/workflows/ci.yml'
      - '.github/workflows/health.yml'
      - '.github/workflows/backup.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Armar _site con lo estrictamente necesario
        run: bash .github/scripts/build-site.sh
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: '_site'
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  smoke:
    name: Smoke test
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Sitio responde y contiene el titulo
        run: |
          ok=0
          for i in 1 2 3 4 5 6; do
            if .github/scripts/probe.sh "https://radarurbano.org/?cb=${GITHUB_SHA}" page.html; then ok=1; break; fi
            echo "Intento $i fallido; reintento en 20s (cache/propagacion)"; sleep 20
          done
          [ "$ok" = 1 ] || { echo "El sitio no respondio"; exit 1; }
          # El titulo solo se verifica si la respuesta fue el sitio y no un reto de Cloudflare
          if [ -s page.html ] && ! grep -q "<title>Radar Urbano" page.html && ! grep -qi "cloudflare" page.html; then
            echo "El sitio respondio pero sin el titulo esperado"; exit 1
          fi
          for p in privacidad.html terminos.html arco.html sitemap.xml robots.txt site-assets/app.js; do
            .github/scripts/probe.sh "https://radarurbano.org/$p"
          done
      - name: API (Supabase), solo si hay secretos
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::notice::Sin SUPABASE_URL/SUPABASE_ANON_KEY; se omite el chequeo de API"; exit 0
          fi
          curl -fsS --max-time 20 -o /dev/null \
            -H "apikey: $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/lada_coordinates?select=code&limit=1" || { echo "La API de Supabase no responde"; exit 1; }
